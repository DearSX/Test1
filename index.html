<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>VELOCITY 3000 — M2</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #05060e; overflow: hidden;
               touch-action: none; -webkit-user-select: none; user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; }
  #controls {
    position: fixed; top: 10px; right: 12px; max-width: 40vw;
    font: 700 10px/1.6 ui-monospace, Menlo, Consolas, monospace;
    color: rgba(125, 249, 255, 0.5); letter-spacing: 1px; text-transform: uppercase;
    text-align: right; pointer-events: none;
  }
  @media (max-width: 600px) { #controls { display: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="controls">↑ throttle · ↓ brake · ←→ steer · shift nitro · M manual · P pit repairs</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
